steps:
  - name: 'node:22'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'node:22'
    dir: 'banking-ui'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'mcr.microsoft.com/playwright:v1.64.0-noble'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm run api &
        npm run dev --prefix banking-ui -- --host 0.0.0.0 &
        sleep 10
        npx playwright test

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'